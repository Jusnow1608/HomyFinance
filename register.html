<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/style.css">

  <title>HomyFinance</title>


</head>

<body class="body-custom">
  <main class="d-flex flex-column min-vh-100">
    <!-- Logo -->

    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center my-1" href="login.html">
            <img src="images/logo.svg" alt="HomyFinance Logo" height="48" width="330" class="d-inline-block">
          </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto navbar-custom">
              <li class="nav-item"><a class="nav-link px-3" href="register.html">Register</a></li>
              <li class="nav-item"><a class="nav-link px-3" href="login.html">Login</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Registration -->
    <section id="register-form" class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <div class="card-body">
                <h1 class="h2 fw-bold text-center mb-2">Create an account</h1>
                <p class="text-muted text-center mb-4">Start managing your household budget today!</p>

                <form>
                  <div class="input-group mb-3">

                    <span class="input-group-text form-control-custom body-custom" id="basic-addon1">
                      <i class="bi bi-person-fill"></i>
                    </span>

                    <input type="text" class="form-control form-control-custom form-control-md" id="name"
                      placeholder="Name" aria-label="Name" aria-describedby="basic-addon1" required>
                  </div>

                  <div class="input-group mb-3">

                    <span class="input-group-text form-control-custom body-custom" id="basic-addon1">
                      <i class="bi bi-envelope-fill"></i>
                    </span>

                    <input type="email" class="form-control form-control-custom form-control-md" id="email"
                      placeholder="Email address" aria-label="Email address" aria-describedby="basic-addon2" required>
                  </div>

                  <div class="input-group mb-3">

                    <span class="input-group-text form-control-custom body-custom" id="basic-addon1">
                      <i class="bi bi-lock-fill"></i>
                    </span>

                    <input type="password" class="form-control form-control-custom form-control-md" id="password"
                      placeholder="Password" aria-label="Password" aria-describedby="basic-addon3" required>
                  </div>

                  <button type="submit"
                    class="btn btn-success btn-success-custom btn-lg w-100 fw-bold mb-3">Continue</button>
                </form>

                <div class="text-center">
                  <span class="text-muted">Already have an account?</span>
                  <a href="login.html" class="text-success text-success-custom text-decoration-none fw-bold">Log In</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
      <div class="container">
        &copy; 2026 HomyFinance. All Rights Reserved.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>

  </main>
</body>

</html>
