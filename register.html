<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">

  <title>HomyFinance</title>


</head>

<body>

  <!-- Logo -->

  <section id="brand-logo">
    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
          <a class="navbar-brand fw-bold text-success" href="#">HomyFinance</a>
        </div>
      </nav>
    </header>
  </section>

  <!-- Registration -->
  <section id="register-form">
    <main class="d-flex align-items-center min-vh-100 py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <div class="card-body">
                <h3 class="fw-bold text-center mb-2">Create an account</h3>
                <p class="text-muted text-center mb-4">Start managing your household budget today!</p>

                <form>
                  <div class="mb-3">
                    <label for="name" class="form-label font-weight-bold">Name</label>
                    <input type="text" class="form-control form-control-md" id="name" placeholder="Provide your name"
                      required>
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-md" id="email" placeholder="Provide your email"
                      required>
                  </div>

                  <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-md" id="password"
                      placeholder="Provide your password" required>
                  </div>

                  <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mb-3">Sign Up</button>
                </form>

                <div class="text-center">
                  <span class="text-muted">Already have an account?</span>
                  <a href="login.html" class="text-success text-decoration-none fw-bold">Log In</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </section>


  <script src="/docs/5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" class="astro-vvvwv3sm"></script>

  
</body>

</html>
