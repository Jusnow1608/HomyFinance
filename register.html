<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="css/style.css">

  <title>HomyFinance - Register</title>


</head>

<body class="body-custom">
  <main class="d-flex flex-column min-vh-100">
    <!-- Logo -->

    <header>
      <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom shadow-sm">
        <div class="container d-flex align-items-center justify-content-between">
          <a class="navbar-brand d-flex align-items-center my-1" href="login.html">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 70" role="img" aria-label="HomyFinance Logo"
              class="d-inline-block navbar-logo">
              <defs>
                <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#f4efe6" />
                </linearGradient>
                <linearGradient id="note-green" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#52796f" />
                  <stop offset="100%" stop-color="#2f3e46" />
                </linearGradient>
                <linearGradient id="gold-money" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f3b61f" />
                  <stop offset="100%" stop-color="#e07a5f" />
                </linearGradient>
                <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2f3e46" flood-opacity="0.12" />
                </filter>
                <filter id="note-shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2f3e46" flood-opacity="0.2" />
                </filter>
              </defs>

              <g id="logo-badge" filter="url(#soft-shadow)">
                <rect x="5" y="5" width="60" height="60" rx="18" fill="url(#badge-bg)" stroke="#e8dfd1"
                  stroke-width="1.5" />
                <g id="money-note" filter="url(#note-shadow)">
                  <rect x="17" y="19" width="36" height="32" rx="6" fill="url(#note-green)" />
                  <rect x="20" y="22" width="30" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="1.2"
                    opacity="0.4" stroke-dasharray="3 1.5" />
                  <circle cx="35" cy="35" r="8.5" fill="url(#gold-money)" />
                  <text x="35" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13"
                    font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
                </g>
              </g>

              <g id="logo-text">
                <text x="80" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="35" font-weight="800"
                  letter-spacing="-0.5px">
                  <tspan fill="#2f3e46">Homy</tspan>
                  <tspan fill="#558467">Finance</tspan>
                </text>
              </g>
            </svg>
          </a>

          <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto navbar-custom">
              <li class="nav-item"><a class="nav-link px-3 active" href="register.html">Register</a></li>
              <li class="nav-item"><a class="nav-link px-3" href="login.html">Login</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <!-- Registration -->
    <section id="register-form" class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <div class="card-body">
                <h1 class="h2 fw-bold text-center mb-2">Create an account</h1>
                <p class="text-muted text-center mb-4">Start managing your household budget today!</p>

                <form>
                  <div class="input-group mb-3 input-group-custom">

                    <span class="input-group-text form-control-custom icon-custom" id="basic-addon1">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6" />
                      </svg>
                    </span>

                    <input type="text" class="form-control form-control-custom form-control-md" id="name"
                      placeholder="Name" aria-label="Name" aria-describedby="basic-addon1" required>
                  </div>

                  <div class="input-group mb-3 input-group-custom">

                    <span class="input-group-text form-control-custom icon-custom" id="basic-addon2">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414z" />
                        <path
                          d="M0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z" />
                      </svg>
                    </span>

                    <input type="email" class="form-control form-control-custom form-control-md" id="email"
                      placeholder="Email address" aria-label="Email address" aria-describedby="basic-addon2" required>
                  </div>

                  <div class="input-group mb-3 input-group-custom">

                    <span class="input-group-text form-control-custom icon-custom" id="basic-addon3">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        viewBox="0 0 16 16">
                        <path
                          d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2" />
                      </svg>
                    </span>

                    <input type="password" class="form-control form-control-custom form-control-md" id="password"
                      placeholder="Password" aria-label="Password" aria-describedby="basic-addon3" required>
                  </div>

                  <button type="submit"
                    class="btn btn-success btn-success-custom btn-lg w-100 fw-bold mb-3">Continue</button>
                </form>

                <div class="text-center">
                  <span class="text-muted">Already have an account?</span>
                  <a href="login.html" class="text-success text-success-custom text-decoration-none fw-bold">Log In</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>

    <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
      <div class="container">
        &copy; 2026 HomyFinance. All Rights Reserved.
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>

  </main>
</body>

</html>
