<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">

  <title>HomyFinance</title>


</head>

<body class="body-custom">
  <main class="d-flex flex-column min-vh-100">
    <!-- Logo -->

    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center my-1" href="#">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 70" height="48" class="d-inline-block">
              <defs>
                <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#f4efe6" />
                </linearGradient>
                <linearGradient id="note-green" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#52796f" />
                  <stop offset="100%" stop-color="#2f3e46" />
                </linearGradient>
                <linearGradient id="gold-money" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#f3b61f" />
                  <stop offset="100%" stop-color="#e07a5f" />
                </linearGradient>
                <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2f3e46" flood-opacity="0.12" />
                </filter>
                <filter id="note-shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2f3e46" flood-opacity="0.2" />
                </filter>
              </defs>

              <g id="logo-badge" filter="url(#soft-shadow)">
                <rect x="5" y="5" width="60" height="60" rx="18" fill="url(#badge-bg)" stroke="#e8dfd1"
                  stroke-width="1.5" />
                <g id="money-note" filter="url(#note-shadow)">
                  <rect x="17" y="19" width="36" height="32" rx="6" fill="url(#note-green)" />
                  <rect x="20" y="22" width="30" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="1.2"
                    opacity="0.4" stroke-dasharray="3 1.5" />
                  <circle cx="35" cy="35" r="8.5" fill="url(#gold-money)" />
                  <text x="35" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="13"
                    font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
                </g>
              </g>

              <g id="logo-text">
                <text x="80" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="35" font-weight="800"
                  letter-spacing="-0.5px">
                  <tspan fill="#2f3e46">Homy</tspan>
                  <tspan fill="#558467">Finance</tspan>
                </text>
                <text x="82" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600"
                  fill="#7f8c8d" letter-spacing="1.5px">SMART BUDGETING</text>
              </g>
            </svg>
          </a>
        </div>
      </nav>
    </header>

    <!-- Registration -->
    <section id="register-form" class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <div class="card-body">
                <h1 class="h2 fw-bold text-center mb-2">Welcome back</h1>
                <p class="text-muted text-center mb-4">Log in to your HomyFinance account!</p>

                <form>
                  <div class="input-group mb-3">
                    <span class="input-group-text form-control-custom" id="basic-addon2">@</span>
                    <input type="text" class="form-control form-control-custom form-control-md" id="email"
                      placeholder="Provide your email" aria-label="Email address" aria-describedby="basic-addon1"
                      required>
                  </div>

                  <div class="input-group mb-3">
                    <span class="input-group-text form-control-custom" id="basic-addon3">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-lock-fill" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                          d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
                      </svg>
                    </span>
                    <input type="text" class="form-control form-control-custom form-control-md" id="password"
                      placeholder="Provide your password" aria-label="Password" aria-describedby="basic-addon1"
                      required>
                  </div>

                  <button type="submit" class="btn btn-success btn-success-custom btn-lg w-100 fw-bold mb-3">Log
                    In</button>
                </form>

                <div class="text-center">
                  <span class="text-muted">Don't have an account?</span>
                  <a href="register.html" class="text-success text-success-custom text-decoration-none fw-bold">Sign up</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  </main>
</body>

</html>
