<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">

  <title>HomyFinance</title>


</head>

<body class="body-custom">
  <main class="d-flex flex-column min-vh-100">
    <!-- Logo -->

    <header>
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container">
          <a class="navbar-brand d-flex align-items-center my-1" href="index.html">
            <img src="images/logo.svg" alt="HomyFinance Logo" height="48" width="330" class="d-inline-block">
          </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto navbar-custom">
              <li class="nav-item"><a class="nav-link px-3" href="register.html">Register</a></li>
              <li class="nav-item"><a class="nav-link px-3" href="login.html">Login</a></li>
            </ul>
          </div>

        </div>
      </nav>
    </header>

    <!-- Login -->
    <section id="register-form" class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <div class="card-body">
                <h1 class="h2 fw-bold text-center mb-2">Welcome back</h1>
                <p class="text-muted text-center mb-4">Log in to your HomyFinance account</p>

                <form>
                  <div class="input-group mb-3">
                    <span class="input-group-text form-control-custom body-custom" id="basic-addon1"><svg
                        xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-envelope-fill" viewBox="0 0 16 16">
                        <path
                          d="M.05 3.555A2 2 0 0 1 2 2h12a2 2 0 0 1 1.95 1.555L8 8.414zM0 4.697v7.104l5.803-3.558zM6.761 8.83l-6.57 4.027A2 2 0 0 0 2 14h12a2 2 0 0 0 1.808-1.144l-6.57-4.027L8 9.586zm3.436-.586L16 11.801V4.697z" />
                      </svg></span>
                    <input type="email" class="form-control form-control-custom form-control-md" id="email"
                      placeholder="Email address" aria-label="Email address" aria-describedby="basic-addon1" required>
                  </div>

                  <div class="input-group mb-3">
                    <span class="input-group-text form-control-custom body-custom" id="basic-addon2">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-lock-fill" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                          d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
                      </svg>
                    </span>
                    <input type="password" class="form-control form-control-custom form-control-md" id="password"
                      placeholder="Password" aria-label="Password" aria-describedby="basic-addon2" required>
                  </div>

                  <button type="submit" class="btn btn-success btn-success-custom btn-lg w-100 fw-bold mb-3">Log
                    In</button>
                </form>

                <div class="text-center">
                  <span class="text-muted">Don't have an account?</span>
                  <a href="register.html" class="text-success text-success-custom text-decoration-none fw-bold">Sign
                    up</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </section>
    
  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
      &copy; 2026 HomyFinance. All Rights Reserved.
    </div>
  </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  </main>
</body>

</html>
